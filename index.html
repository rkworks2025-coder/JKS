<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>JKS Field</title>
  <style>
    /* Reset & Base */
    body {
      background-color: #000000;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      margin: 0; padding: 0;
      padding-bottom: 60px;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    .header {
      background: rgba(20, 20, 20, 0.95);
      backdrop-filter: blur(10px);
      padding: 10px 15px;
      position: sticky; top: 0; z-index: 100;
      border-bottom: 1px solid #333;
    }
    .header-top {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px;
    }
    .logo { font-size: 20px; font-weight: 900; color: #fff; letter-spacing: -0.5px; }
    .badge { background: #0066cc; color: #fff; font-size: 10px; padding: 3px 6px; border-radius: 4px; vertical-align: middle; margin-left: 5px; }

    /* Area Tabs */
    .area-tabs {
      display: flex; gap: 10px;
      background: #111;
      padding: 4px; border-radius: 8px;
    }
    .tab-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: #666;
      padding: 8px 0;
      font-size: 14px; font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: #333;
      color: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }
    /* エリア別カラー */
    .tab-btn.active[data-area="tama"] { border-bottom: 2px solid #00bfff; color: #00bfff; }
    .tab-btn.active[data-area="kanagawa"] { border-bottom: 2px solid #ff9900; color: #ff9900; }

    /* Scan Area */
    .scan-area {
      padding: 20px;
      text-align: center;
      background: #050505; border-bottom: 1px solid #222;
    }
    
    #scan-btn {
      background: linear-gradient(135deg, #444, #666);
      color: white; border: none;
      padding: 14px 40px; border-radius: 50px;
      font-size: 18px; font-weight: bold;
      box-shadow: 0 4px 15px rgba(0,0,0, 0.4);
      width: 100%; max-width: 300px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.1s, background 0.3s;
    }
    #scan-btn.ready-tama { background: linear-gradient(135deg, #00bfff, #0077ff); box-shadow: 0 4px 15px rgba(0, 119, 255, 0.4); }
    #scan-btn.ready-kanagawa { background: linear-gradient(135deg, #ff9900, #ff5500); box-shadow: 0 4px 15px rgba(255, 153, 0, 0.4); }
    
    #scan-btn:active { transform: scale(0.96); }
    
    #status-msg { margin-top: 10px; font-size: 12px; color: #666; height: 1.2em; }

    /* List Area */
    .list-container { padding: 15px; max-width: 600px; margin: 0 auto; }
    
    .empty-state { text-align: center; color: #444; margin-top: 50px; font-size: 14px; }

    /* Alert Box */
    .missing-alert {
      background: #331111;
      border: 1px solid #e63946;
      color: #ffcccc;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 8px;
      font-size: 12px;
      display: none; 
      line-height: 1.5;
    }
    .missing-title { font-weight: bold; color: #ff6666; margin-bottom: 4px; }

    /* Card Design */
    .card {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 12px;
      margin-bottom: 15px;
      overflow: hidden;
      animation: fadeIn 0.3s ease-out;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .card-header {
      background: #252525;
      padding: 10px 15px;
      display: flex;
      justify-content: space-between; align-items: center;
      border-bottom: 1px solid #333;
    }
    
    .dist-badge {
      font-weight: bold;
      font-size: 16px; color: #fff;
      display: flex; align-items: center; gap: 5px;
    }
    .dist-unit { font-size: 12px; color: #888; font-weight: normal; }

    .urgent-badge {
      background: #e63946; color: #fff;
      font-size: 11px;
      font-weight: bold;
      padding: 2px 6px; border-radius: 4px;
      margin-left: 8px;
      display: none; 
    }
    .urgent-active { display: inline-block; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

    .nav-btn {
      background: transparent;
      color: #00bfff;
      border: 1px solid #00bfff;
      padding: 5px 12px; border-radius: 20px;
      font-size: 12px; font-weight: bold;
      text-decoration: none;
    }
    .nav-btn:active { background: rgba(0, 191, 255, 0.2); }

    .card-body { padding: 15px; }
    
    .station-name {
      font-size: 15px; font-weight: bold;
      color: #fff;
      margin-bottom: 6px; line-height: 1.4;
    }
    
    /* 文字サイズをステーション名と同じ15pxに変更 */
    .car-info {
      font-size: 15px;
      color: #aaa;
      display: flex; gap: 10px; margin-bottom: 12px;
      align-items: baseline;
    }
    .plate { color: #ddd; font-weight: bold; }

    .time-info {
      font-size: 12px; color: #888;
      background: #111; padding: 8px;
      border-radius: 6px;
      display: flex; align-items: center; gap: 6px;
    }
    .time-val { color: #fff; font-weight: bold; font-size: 14px; }
    
    .error-text { color: #ff3399; font-weight: bold; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-top">
      <div class="logo">JKS <span class="badge" id="area-badge">FIELD</span></div>
      <div style="font-size:12px; color:#666;">v2.1</div>
    </div>
    <div class="area-tabs">
      <button class="tab-btn" data-area="tama" onclick="switchArea('tama')">多摩</button>
      <button class="tab-btn" data-area="kanagawa" onclick="switchArea('kanagawa')">神奈川</button>
    </div>
  </div>

  <div class="scan-area">
    <button id="scan-btn" type="button" onclick="startScan()">エリアを選択</button>
    <div id="status-msg">GPS情報を取得して検索します</div>
  </div>

  <div id="result-list" class="list-container">
    <div id="missing-alert-box" class="missing-alert"></div>
    <div class="empty-state">
      エリアを選んで<br>ボタンを押してください
    </div>
  </div>

  <script>
    // いただいたURLを設定済み
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbywQoNFA2x7qn8cMelt_5OVPiNumBYqPbTNnK3nzXWv59q0FmP2Mt8qmVxT5Zk6wPEr/exec";
    
    let currentArea = 'tama'; 

    window.onload = function() {
      // 1. URLの記憶: localStorageはGitHubのドメイン配下なら永続化されます
      const savedArea = localStorage.getItem('jks_area_mode');
      if (savedArea && (savedArea === 'tama' || savedArea === 'kanagawa')) {
        switchArea(savedArea);
      } else {
        switchArea('tama'); 
      }
    };

    function switchArea(area) {
      currentArea = area;
      
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.dataset.area === area) {
          btn.classList.add('active');
        }
      });

      const btn = document.getElementById('scan-btn');
      btn.className = ''; 
      if (area === 'tama') {
        btn.classList.add('ready-tama');
        btn.textContent = "📡 多摩をスキャン";
      } else {
        btn.classList.add('ready-kanagawa');
        btn.textContent = "📡 神奈川をスキャン";
      }
      document.getElementById('area-badge').textContent = (area === 'tama') ? 'TAMA' : 'KNGW';
      localStorage.setItem('jks_area_mode', area);
    }

    function startScan() {
      const btn = document.getElementById('scan-btn');
      const msg = document.getElementById('status-msg');
      const list = document.getElementById('result-list');

      if (!GAS_API_URL.startsWith("http")) {
        showError("コード内のGAS_API_URLを設定してください");
        return;
      }

      if (!navigator.geolocation) {
        showError("GPSがサポートされていません");
        return;
      }

      btn.disabled = true;
      const originalText = btn.textContent;
      btn.textContent = "位置特定中...";
      btn.style.opacity = "0.7";
      msg.className = ""; 
      msg.textContent = "GPS信号を受信しています...";
      list.innerHTML = '<div id="missing-alert-box" class="missing-alert"></div>';
      
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          
          btn.textContent = "通信中...";
          msg.textContent = `API照会中...`;

          // APIへのアクセス (fetch)
          const targetUrl = `${GAS_API_URL}?lat=${lat}&lng=${lng}&area=${currentArea}`;

          fetch(targetUrl)
            .then(response => response.json())
            .then(data => {
              if(data.error) {
                handleServerError(data.error, originalText);
              } else {
                renderResults(data, originalText);
              }
            })
            .catch(err => {
              handleServerError(err.message, originalText);
            });
        },
        (err) => {
          let errorText = "GPSエラー: ";
          switch(err.code) {
            case 1: errorText += "許可されていません"; break;
            case 2: errorText += "位置を特定できません"; break;
            case 3: errorText += "タイムアウト"; break;
            default: errorText += err.message;
          }
          showError(errorText);
          resetBtn(originalText);
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    function renderResults(data, originalText) {
      const list = document.getElementById('result-list');
      const msg = document.getElementById('status-msg');
      resetBtn(originalText);

      list.innerHTML = '<div id="missing-alert-box" class="missing-alert"></div>';
      const alertBox = document.getElementById('missing-alert-box');
      
      if (data.missing && data.missing.length > 0) {
        alertBox.style.display = "block";
        alertBox.innerHTML = '<div class="missing-title">⚠️ 表示できない車両</div>' +
                             data.missing.join('<br>'); 
      }

      if (!data.items || data.items.length === 0) {
        list.insertAdjacentHTML('beforeend', '<div class="empty-state">このエリアに<br>作業可能な車両はありません</div>');
        msg.textContent = "検索完了: 0件";
        return;
      }

      data.items.forEach(item => {
        const urgentClass = item.isUrgent ? "urgent-active" : "";
        const mapUrl = "http://maps.google.com/maps?q=" + item.lat + "," + item.lng;
        
        let distDisplay = item.distance;
        let unitDisplay = "m";
        if (item.distance >= 1000) {
          distDisplay = (item.distance / 1000).toFixed(1); 
          unitDisplay = "km";
        }

        let distStyle = "";
        if (item.isUrgent && item.distance < 1000) {
          distStyle = "color: #FFD700;";
        }
        const timeColor = item.isUrgent ? "#ff4444" : "#00bfff";

        const html = `
          <div class="card">
            <div class="card-header">
              <div class="dist-badge" style="${distStyle}">
                ${distDisplay} <span class="dist-unit">${unitDisplay}</span>
                <span class="urgent-badge ${urgentClass}">1-3h</span>
              </div>
              <a href="${mapUrl}" target="_blank" class="nav-btn">NAV ↗</a>
            </div>
            <div class="card-body">
              <div class="station-name">${item.station}</div>
              <div class="car-info">
                <span class="plate">${item.plate}</span>
                <span>/ ${item.model}</span>
              </div>
              <div class="time-info">
                <span>残り空き時間:</span>
                <span class="time-val" style="color:${timeColor}">${item.availableHours}h</span>
              </div>
            </div>
          </div>
        `;
        list.insertAdjacentHTML('beforeend', html);
      });

      msg.textContent = `検索完了: ${data.items.length}件を表示`;
    }

    function handleServerError(msgText, originalText) {
      showError("通信エラー: " + msgText);
      resetBtn(originalText);
    }

    function showError(text) {
      const msg = document.getElementById('status-msg');
      msg.textContent = text;
      msg.className = "error-text";
    }

    function resetBtn(text) {
      const btn = document.getElementById('scan-btn');
      btn.disabled = false;
      btn.textContent = text || "📡 周辺スキャン";
      btn.style.opacity = "1";
    }
  </script>
</body>
</html>
